name: ua-helper

services:
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/data
    expose:
      - "3000"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
      - ./downloads:/var/www/downloads:ro
    depends_on:
      - api

  # Optional local speech-to-text (faster-whisper, CPU).
  # Enable with: docker compose --profile voice up -d
  whisper:
    build: ./whisper
    profiles: ["voice"]
    restart: unless-stopped
    environment:
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
    volumes:
      - whisper-cache:/models

volumes:
  whisper-cache:
