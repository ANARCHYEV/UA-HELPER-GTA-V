server {
    listen 80;
    listen [::]:80;
    server_name gtavhelper.pp.ua www.gtavhelper.pp.ua api.gtavhelper.pp.ua;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name gtavhelper.pp.ua www.gtavhelper.pp.ua;

    ssl_certificate     /etc/letsencrypt/live/gtavhelper.pp.ua/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gtavhelper.pp.ua/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    client_max_body_size 12m;
    error_page 404 /404.html;

    location = /404.html {
        internal;
        root /var/www/ua-helper-landing;
    }

    location / {
        root /var/www/ua-helper-landing;
        try_files $uri $uri/ =404;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.gtavhelper.pp.ua;

    ssl_certificate     /etc/letsencrypt/live/gtavhelper.pp.ua/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gtavhelper.pp.ua/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    client_max_body_size 12m;

    location /downloads/ {
        alias /opt/ua-helper/server/downloads/;
        autoindex off;
        add_header Access-Control-Allow-Origin "*" always;
    }

    location / {
        proxy_pass http://127.0.0.1:3099;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
