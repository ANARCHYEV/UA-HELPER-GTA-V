server {
    listen 80;
    listen [::]:80;
    server_name gtavhelper.pp.ua www.gtavhelper.pp.ua api.gtavhelper.pp.ua;

    # Used only for the initial Let's Encrypt webroot challenge.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 404;
    }
}
